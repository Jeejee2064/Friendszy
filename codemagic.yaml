# Build iOS (Capacitor) sans Mac : Codemagic compile, signe et envoie sur TestFlight.
# Réglages à faire dans l'interface Codemagic (aucun secret dans ce fichier) :
#   1. Teams → Integrations → App Store Connect : ajouter la clé API (.p8, Key ID,
#      Issuer ID) sous le nom « Codemagic » (nom repris dans `integrations` ci-dessous).
#   (APP_STORE_APPLE_ID, l'identifiant numérique de l'app dans App Store Connect,
#   n'est pas un secret : il est défini plus bas dans `vars`.)
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Codemagic
    environment:
      node: 22
      xcode: latest
      vars:
        APP_STORE_APPLE_ID: 6839190066
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ca.friendszy.app
    triggering:
      events: []   # build manuel uniquement (bouton « Start new build »)
    scripts:
      - name: Installer les dépendances
        script: npm ci
      - name: Synchroniser Capacitor (iOS)
        script: npx cap sync ios
      - name: Appliquer la signature
        script: xcode-project use-profiles
      - name: Numéro de build = dernier TestFlight + 1
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App
          agvtool new-version -all $((LATEST + 1))
      - name: Compiler l'IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Envoi seulement : les testeurs INTERNES (équipe App Store Connect) voient le
        # build sans revue Apple. `true` déclenche la revue bêta EXTERNE, qui exige
        # d'abord les « Test Information » (courriel de retour, contact de revue).
        submit_to_testflight: false
